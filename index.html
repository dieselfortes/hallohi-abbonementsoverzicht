<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h1>Hallo Hi Abonnementenoverzicht</h1>
    <table>
    <colgroup>
    <col span="2" class="Abbonement">
    <col span="2" class="Snelheid">
    <col span="2" class="Data">
    <col span="2" class="Maandprijs">
    </colgroup>
    <thead>
        <tr>
            <th class="Abbonement">Abbonement</th>
            <th class="Abbonement">Snelheid</th>
            <th class="Abbonement">Data</th>
            <th class="Abbonement">Maandprijs</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="Basic">Basic</td>
            <td class="Snelheid">300mb/s</td>
            <td class="Data">2GB</td>
            <td class="Maandprijs">16,50,-</td>
        </tr>
        <tr>
            <td class="Basic">start</td>
            <td class="Snelheid">300mb/s</td>
            <td class="Data">10GB</td>
            <td class="Maandprijs">18,00,-</td>
        </tr>
        <tr>
            <td class="Basic">Unlimited</td>
            <td class="Snelheid">400mb/s</td>
            <td class="Data">50GB</td>
            <td class="Maandprijs">32,50,-</td>
        </tr>
        <tr>
            <td class="Basic">Unlimited Plus</td>
            <td class="Snelheid">700mb/s</td>
            <td class="Data">60GB</td>
            <td class="Maandprijs">37,50,-</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
